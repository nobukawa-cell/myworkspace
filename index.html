<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Workspace">
<meta name="theme-color" content="#f6f3ee">
<title>My Workspace</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--panel:#fbf9f6;--card:#ffffff;--text:#2b2a28;--sub:#8a857d;--line:#e8e2d9;
  --accent:#b5835a;--accent-soft:#f1e6da;--late:#c8553d;
  --todo:#b8b2a7;--doing:#d9a441;--review:#7f9bbd;--hold:#b39ab8;--done:#7a9e7e;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 20px rgba(60,40,20,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19;--panel:#22211e;--card:#2a2825;--text:#ece8e1;--sub:#9b958b;--line:#3a3732;--accent:#d3a37a;--accent-soft:#3a3029;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#1c1b19;--panel:#22211e;--card:#2a2825;--text:#ece8e1;--sub:#9b958b;--line:#3a3732;--accent:#d3a37a;--accent-soft:#3a3029;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:26px;padding:0 10px 18px;letter-spacing:.5px}
.nav-label{font-size:11px;color:var(--sub);letter-spacing:.12em;padding:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;color:var(--text)}
.nav:hover{background:var(--accent-soft)}
.nav.on{background:var(--accent-soft);font-weight:700}
.nav .ico{width:22px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--sub)}
.nav.add{color:var(--sub)}

/* main */
main{min-width:0}
.en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.14em;letter-spacing:.01em}
.page{max-width:1080px;margin:0 auto;padding:36px 40px 80px}
.hero{height:220px;border-radius:0 0 var(--radius) var(--radius);background-size:cover;background-position:center;position:relative}
.hero{overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;transition:none}
.hero-btns{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;opacity:0;transition:.2s;z-index:2}
.hero:hover .hero-btns{opacity:1}
.hero-btns button,.repos-bar button{background:rgba(255,255,255,.88);color:#333;padding:5px 12px;border-radius:20px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero-btns button:hover{background:#fff}
.hero.repos .hero-btns{display:none}
.hero.repos .hero-img{cursor:grab}
.hero.repos .hero-img:active{cursor:grabbing}
.hero.repos{outline:2px solid rgba(255,255,255,.7);outline-offset:-2px;transition:height .05s}
.repos-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.5);color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;pointer-events:none;backdrop-filter:blur(4px);animation:fadeout 2.5s 1.5s forwards}
@keyframes fadeout{to{opacity:0}}
.repos-bar{position:absolute;right:16px;bottom:14px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);color:#333;padding:6px 8px 6px 16px;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:3;font-size:12px;flex-wrap:wrap}
.repos-bar label{display:flex;align-items:center;gap:6px}
.repos-bar input[type=range]{width:110px;accent-color:#b5835a}
.repos-bar button{box-shadow:none}
.repos-bar .ok{background:#b5835a;color:#fff}
.repos-bar .ghost{background:transparent}
.hero+.page{padding-top:0}
.page-icon{font-size:56px;margin-top:-36px;position:relative;line-height:1;cursor:pointer;display:inline-block}
h1.title{font-size:32px;font-weight:700;margin:10px 0 4px;outline:none}
.lead{color:var(--sub);margin:0 0 26px}
.greet{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:44px;margin:8px 0 0;font-weight:500}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.gcard{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;padding:0;display:block;width:100%}
.gcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(60,40,20,.12)}
.gcard .cv{height:120px;background-size:cover;background-position:center}
.gcard .bd{padding:16px 18px 16px}
.gcard .nm{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.gcard .mini{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard.new{display:flex;align-items:center;justify-content:center;min-height:110px;border:1.5px dashed var(--line);background:transparent;box-shadow:none;color:var(--sub)}

.section-h{display:flex;align-items:center;gap:10px;margin:34px 0 12px}
.section-h h2{font-size:15px;margin:0}
.section-h .s{color:var(--sub);font-size:12px}

/* tasks */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(160,140,110,.07);border-radius:var(--radius);padding:12px;min-height:160px}
.col.over{outline:2px dashed var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:2px 4px 10px}
.pill{width:9px;height:9px;border-radius:50%}
.task{background:var(--card);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;overflow:hidden}
.task img{display:block;width:100%;height:110px;object-fit:cover}
.task .in{padding:10px 12px}
.task .t{font-weight:500}
.task.done .t{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--sub)}
.chip{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:10px}
.late{color:var(--late)}
.quick{display:flex;gap:6px;margin-top:4px}
.quick input{flex:1;min-width:0;border:none;background:transparent;padding:6px 4px;outline:none}
.quick input::placeholder{color:var(--sub)}

.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:var(--accent-soft)}
.li .cat{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--sub);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.check.on{background:var(--done);border-color:var(--done)}
.empty{color:var(--sub);text-align:center;padding:36px}

/* calendar */
.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-top .m{font-size:22px;font-weight:700;min-width:150px}
.btn{padding:6px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:13px}
.btn.primary{background:var(--accent);color:#fff}
.tabs{margin-left:auto;display:flex;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:3px}
.tabs button{padding:4px 14px;border-radius:16px;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal .dw{font-size:11px;color:var(--sub);padding:8px;text-align:center;border-bottom:1px solid var(--line)}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;font-size:12px;cursor:pointer}
.cal .d:nth-child(7n){border-right:none}
.cal .d.other{opacity:.4}
.cal .d .n{font-size:12px;color:var(--sub)}
.cal .d.hol .n{color:var(--late)}
.cal .d.sat .n{color:#4a78b5}
.cal .holname{display:block;font-size:10.5px;color:var(--late);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d.today .n{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center}
.gev{display:block;width:100%;text-align:left;font-size:11px;padding:1px 5px;border-radius:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;line-height:1.5}
.gev.timed{background:none!important;color:var(--ink,#2b2a28);padding-left:2px}.gev.timed i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px}
.cal .d.sel{background:rgba(180,140,100,.10)}
.gday{margin-top:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.gday h3{margin:0 0 8px;font-size:15px}.gday .it{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:14px;color:inherit;text-decoration:none}
.gday .it .t{width:84px;flex:none;color:var(--sub);font-size:12.5px}.gday .it i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.gerr{font-size:12.5px;background:#fff6dc;border-radius:10px;padding:8px 12px;margin:0 0 10px;line-height:1.6}
@media (max-width:760px){.gev{font-size:9.5px;padding:0 3px}.gev.timed{border-left:3px solid;padding-left:3px}.gev.timed i{display:none}.gday .it .t{width:70px}}
.ev{display:block;width:100%;text-align:left;font-size:11.5px;padding:1px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.gframe{width:100%;height:680px;border:none;border-radius:var(--radius);box-shadow:var(--shadow);background:#fff}
.hint{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.hint ol{padding-left:20px;margin:8px 0 14px}
.hint input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

/* widgets */
.top{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.clock{text-align:center}
.side-clock{display:flex;flex-direction:column;align-items:center;margin:0 0 18px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.side-clock .flip{gap:3px}
.side-clock .flip .tile{width:50px;height:60px;font-size:38px;line-height:60px;border-radius:8px}
.side-clock .flip .colon{font-size:24px}
.side-clock .date{font-size:11px;margin-top:8px;color:var(--sub)}
.top-clock{display:flex;flex-direction:column;align-items:center;margin:4px 0 26px}
.top-clock .flip .tile{width:64px;height:78px;font-size:50px;line-height:78px;border-radius:9px}
.top-clock .flip .colon{font-size:38px}
.top-clock .date{font-size:13px;margin-top:10px}
main{transition:background-color .3s}
main.darkbg{--text:#f2efe9;--sub:#bdb6ab;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.09);--accent-soft:rgba(255,255,255,.12);color:var(--text)}
main.darkbg .col{background:rgba(255,255,255,.06)}
.bgbtn{position:fixed;top:14px;right:18px;z-index:5;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:6px 14px;font-size:12.5px;color:var(--text)}
.bgpop{position:fixed;top:52px;right:18px;z-index:6;max-height:calc(100vh - 70px);overflow:auto;background:#fff;color:#2b2a28;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:14px;width:248px}
.bgpop .sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 12px}
.bgpop .sw button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.bgpop .sw button.on{outline:2px solid #b5835a;outline-offset:2px}
.bgpop .bgimg{border-top:1px solid #eee;margin-top:12px;padding-top:12px}
.bgpop .thumb{height:70px;border-radius:10px;background-size:cover;background-position:center;margin:8px 0}
.mini-btn{white-space:nowrap;font-size:12px;padding:4px 10px;border-radius:14px;background:#f1ebe2;color:#2b2a28}.mini-btn.on{background:#b5835a;color:#fff}
main.hasimg{background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat}
main.darkbg .lead,main.darkbg .greet{text-shadow:0 1px 8px rgba(0,0,0,.35)}
aside,.tabbar{transition:background-color .3s}
aside.darkside,.tabbar.darkside{--text:#f2efe9;--sub:#c9c2b6;--line:rgba(255,255,255,.14);--accent-soft:rgba(255,255,255,.13);color:var(--text)}
@media (max-width:760px){main.hasimg{background-attachment:scroll}}
.bgpop .r{display:flex;align-items:center;gap:8px;font-size:12px}
.bgpop input[type=color]{width:36px;height:28px;border:none;padding:0;background:none;cursor:pointer}
.flip{display:flex;align-items:center;gap:6px}
.flip .tile{position:relative;width:46px;height:56px;border-radius:7px;background:linear-gradient(#2b2b2b 50%,#1f1f1f 50%);color:#f2f2f2;
  font:500 36px/56px "Courier New",ui-monospace,monospace;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.flip .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.flip .tile.tick{animation:flip .35s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(-80deg);filter:brightness(.7)}100%{transform:rotateX(0)}}
.flip .colon{font-size:28px;font-weight:700;color:var(--text);margin:0 1px}
.clock .date{font-size:12px;font-weight:700;margin-top:6px;letter-spacing:.02em}
.weather{position:relative;background:#1b1b1b;color:#f4f4f4;border-radius:var(--radius);padding:26px 28px;display:grid;grid-template-columns:200px repeat(7,1fr);align-items:center;gap:6px;box-shadow:var(--shadow);margin-bottom:30px;overflow-x:auto}
.weather .now{display:flex;align-items:center;gap:14px}
.weather .city{font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer}
.weather .city small{display:block;font-weight:400;font-size:12px;opacity:.7;letter-spacing:.1em}
.weather .temp{font-size:28px;font-weight:700;line-height:1.1}
.weather .desc{font-size:12px;opacity:.8}
.weather .day{text-align:center;min-width:72px}
.weather .day .sh{display:none}.weather .day b{display:block;font-size:13px;margin-bottom:6px;letter-spacing:.03em}
.weather .day .i{font-size:26px;line-height:1.3}
.weather .day .hi{font-size:13px;margin-top:4px}
.weather .day .lo{font-size:12px;opacity:.65}
.weather .wxbtn{position:absolute;top:10px;right:12px;font-size:12px;color:inherit;opacity:0;transition:.2s;background:rgba(127,127,127,.25);padding:3px 10px;border-radius:12px}
.weather:hover .wxbtn{opacity:.9}
.weather.light{color:#2b2a28}
.weather .msg{grid-column:1/-1;opacity:.7;font-size:13px}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:-10px 0 20px}
.types button{padding:4px 12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:12.5px}
.types button.on{background:var(--accent);color:#fff}
.types .tadd{background:transparent;box-shadow:none;border:1px dashed var(--line);color:var(--sub)}
.types .x{color:var(--late);font-weight:700;margin-left:2px}
.chip.type{background:rgba(127,155,189,.16);color:#5f7fa6}
.gcals{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.gcals .gdot{width:14px;height:14px;border-radius:4px;padding:0;flex:none}
.gcals .gc{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);padding:4px 6px 4px 12px;border-radius:16px;font-size:12.5px}
.gcals .gc button{color:var(--sub);padding:0 4px}
.gcals form{display:flex;gap:6px;flex:1;min-width:260px}
.gcals input{flex:1;padding:6px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
@media (max-width:760px){.weather{grid-template-columns:repeat(7,minmax(0,1fr));padding:18px 12px;gap:2px}.weather .now{grid-column:1/-1;margin-bottom:12px;padding:0 6px}
  .weather .day{min-width:0}.weather .day .lg{display:none}.weather .day .sh{display:inline!important}.gev .tm{display:none}.weather .day b{font-size:11px;margin-bottom:2px}.weather .day .i{font-size:19px}.weather .day .hi{font-size:12px}.weather .day .lo{font-size:11px}.weather .wxbtn{opacity:.8}}

/* Notion風テーブル */
.vtabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:8px;flex-wrap:wrap}
.vtabs button{padding:5px 12px;border-radius:8px;color:var(--sub);font-size:13.5px}
.vtabs button.on{background:var(--accent-soft);color:var(--text);font-weight:700}
.vtabs .sp{flex:1}
.vtabs .hidedone{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;margin-right:8px}
.vtabs .new{background:#2f80ed;color:#fff;font-weight:700;padding:5px 14px}
.ntable-wrap{overflow-x:auto}
.ntable{width:100%;min-width:820px;border-collapse:collapse;font-size:14px}
.ntable th{font-weight:400;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13.5px;cursor:pointer;user-select:none}
.ntable th .hi{opacity:.7;margin-right:6px}
.ntable td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle;height:44px}
.ntable td+td,.ntable th+th{border-left:1px solid var(--line)}
.ntable tr:hover td{background:rgba(127,127,127,.05)}
.ntable .tname{display:flex;align-items:center;gap:4px}
.ntable input.cell.tt{font-weight:700}
.ntable tr.done input.cell.tt{text-decoration:line-through;color:var(--sub)}
.rgrip{cursor:grab;color:var(--sub);opacity:0;padding:0 2px;user-select:none;font-size:14px}
.ntable tr:hover .rgrip{opacity:.7}
.ntable tr.dragging td{opacity:.4}
.ntable tr.ins-top td{box-shadow:inset 0 2px 0 #2f80ed}
.ntable tr.ins-bot td{box-shadow:inset 0 -2px 0 #2f80ed}
.sortinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 0 2px}
.sortinfo button{color:var(--accent);font-size:12px;text-decoration:underline}
.sortinfo span{margin-left:auto;opacity:.8}
.ntable .tname .open{cursor:pointer;opacity:0;font-size:11.5px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--card);color:var(--sub);margin-left:auto;white-space:nowrap}
.ntable tr:hover .tname .open{opacity:1}
.ntable tr.done .tname span.tt{text-decoration:line-through;color:var(--sub)}
.ntable input.cell{width:100%;border:none;background:transparent;color:inherit;padding:4px 2px;outline:none;font-size:14px}
.ntable input.cell:focus{background:var(--card);box-shadow:0 0 0 2px rgba(47,128,237,.35);border-radius:4px}
.ntable input[type=date].cell{color:var(--sub)}
.ntable input[type=date].cell.late{color:var(--late)}
.ntable input.nodate:not(:focus){color:transparent}
.ntable tr:hover input.nodate:not(:focus){color:var(--sub);opacity:.5}
.spill{appearance:none;-webkit-appearance:none;border:none;border-radius:12px;padding:2px 12px 2px 24px;font-size:13.5px;cursor:pointer;background-repeat:no-repeat;background-position:10px 50%;background-size:8px 8px;outline:none}
.tpill{appearance:none;-webkit-appearance:none;border:none;border-radius:5px;padding:3px 9px;font-size:13.5px;cursor:pointer;outline:none;max-width:100%}
.tpill.none{background:transparent;color:var(--sub);opacity:0}

<script>
/* ============ カスタマイズ用の設定 ============ */
const STATUSES=[
  {id:'todo',label:'未着手',color:'var(--todo)'},
  {id:'doing',label:'進行中',color:'var(--doing)'},
  {id:'review',label:'確認中',color:'var(--review)'},
  {id:'hold',label:'保留',color:'var(--hold)'},
  {id:'done',label:'完了',color:'var(--done)'},
];
const COVERS=[
  'linear-gradient(135deg,#f6d5c3,#e8b4a0 50%,#c98f7a)',
  'linear-gradient(135deg,#dfe7d6,#b7c9a8 60%,#8fa98a)',
  'linear-gradient(135deg,#d8e3ef,#a9bfd8 60%,#7f9bbd)',
  'linear-gradient(135deg,#efe4cf,#dcc49b 60%,#c2a36f)',
  'linear-gradient(135deg,#e9dcef,#c8b2d6 60%,#a58cbc)',
  'linear-gradient(135deg,#2b2d42,#4a4e69 60%,#9a8c98)',
  'linear-gradient(160deg,#fbe8e6 0%,#f7cac9 40%,#92a8d1 100%)',
  'radial-gradient(circle at 30% 30%,#fff3d6,#f4c27a 50%,#d98e48)',
];
const EMOJIS='📁💼🏠📚✍️🎨💡🧘🏃🍳💰✈️🎵🛒🌿⭐️🧠📷❤️🗂️'.match(/\p{Extended_Pictographic}️?/gu);
const WORK_TYPES=['定期タスク','新チーム','大黒柱','介護事業部','ポータルサイト','ケアカルテ','ケアコネ'];
/* タスクの種類の見た目（ここにない種類は自動で色が付きます） */
const TYPE_STYLE={
  '定期タスク':{ico:'🔄',bg:'#d3e5f5',fg:'#2b5f8a'},
  '新チーム':{ico:'★',bg:'#e6dcf1',fg:'#5b3f86'},
  '大黒柱':{ico:'🌳',bg:'#dbe8dc',fg:'#3f6845'},
  '介護事業部':{ico:'🤝',bg:'#f6e3c8',fg:'#8a5a1e'},
  'ポータルサイト':{ico:'',bg:'#f5dcc8',fg:'#8a4f2a'},
  'ケアカルテ':{ico:'📋',bg:'#f6d9dd',fg:'#8a3644'},
  'ケアコネ':{ico:'🔗',bg:'#dbeceb',fg:'#2f6b67'},
};
const TYPE_AUTO=[['#e3e2de','#55534e'],['#eee0da','#7a4b3a'],['#fbecd0','#8a6116'],['#fbf3c9','#7a6612'],['#dbeddb','#2f6b3a'],['#d3e5ef','#2b5f7a'],['#e8deee','#5b3f76'],['#f5e0e9','#8a3a5c']];
/* ステータスの見た目 */
const STATUS_PILL={todo:['#f8dcd8','#b5423a','#e15a4f'],doing:['#d3e5f5','#2b5f8a','#3b82d6'],review:['#e6dcf1','#5b3f86','#9b6bd3'],hold:['#f1e7c8','#7a6115','#d0a72a'],done:['#dbe8dc','#3f6845','#5a9a63']};
/* ============================================ */

const KEY='myworkspace.v2';
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bg=v=>!v?COVERS[0]:(v.startsWith('linear')||v.startsWith('radial'))?v:`url('${v.replace(/'/g,'%27').replace(/"/g,'%22')}')`;

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){
  const w=uid(),p=uid(),l=uid(),t=today();
  S={categories:[
      {id:w,name:'Work',icon:'💼',cover:COVERS[2],types:[...WORK_TYPES]},
      {id:p,name:'Private',icon:'🏠',cover:COVERS[0],types:[]},
      {id:l,name:'Study',icon:'📚',cover:COVERS[1],types:[]}],
    tasks:[
      {id:uid(),catId:w,title:'企画書のたたき台を作る',status:'doing',due:t,time:'',priority:'高',note:'',image:''},
      {id:uid(),catId:w,title:'週次ミーティングの資料',status:'todo',due:'',time:'',priority:'中',note:'',image:''},
      {id:uid(),catId:p,title:'週末の買い物リスト',status:'todo',due:t,time:'',priority:'',note:'',image:''},
      {id:uid(),catId:l,title:'本を1章読む',status:'done',due:'',time:'',priority:'',note:'',image:''}],
    settings:{}};
}
/* 以前のデータを新しい形に合わせる */
S.settings??={};
if(!S.v3){
  const EN={'仕事':'Work','プライベート':'Private','学び':'Study'};
  S.categories.forEach(c=>{if(EN[c.name])c.name=EN[c.name];c.types??=[];if(c.name==='Work'&&!c.types.length)c.types=[...WORK_TYPES]});
  if(S.settings.gcal&&!S.settings.gcals)S.settings.gcals=S.settings.gcal.split(/[\s,、]+/).filter(Boolean);
  delete S.settings.gcal;S.v3=true;
}
S.categories.forEach(c=>c.types??=[]);
S.settings.gcals??=[];
S.memos??=[];
if(S.widgets?.some(w=>w.kind==='memo')){S.widgets.filter(w=>w.kind==='memo').forEach(w=>{if(w.text)S.memos.unshift({id:w.id,text:w.text,color:w.color,w:260,h:220,fs:14,at:Date.now()})});S.widgets=S.widgets.filter(w=>w.kind!=='memo')}
S.settings.weather??={name:'FUKUYAMA',lat:34.4858,lon:133.3626};
if(!S.v4){S.categories.forEach(c=>{if(c.name==='Work'&&!c.types.includes('定期タスク'))c.types.unshift('定期タスク');c.view??='table'});S.v4=true}
/* ---------- Notionから書き出したタスク（2026/11/12 取り込み分・最初に1回だけ反映） ---------- */
const NOTION_IMPORT={"work":[],"private":[],"ideas":[]};
function importNotion(){
  if(S.notionImported)return 0;
  const DEMO=['企画書のたたき台を作る','週次ミーティングの資料','週末の買い物リスト','本を1章読む'];
  S.tasks=S.tasks.filter(t=>!DEMO.includes(t.title));
  const catBy=(name,icon,cover)=>{let c=S.categories.find(x=>x.name===name);if(!c){c={id:uid(),name,icon,cover,types:[]};S.categories.push(c)}c.types??=[];return c};
  let n=0;
  [['work',catBy('Work','💼',COVERS[2])],['private',catBy('Private','🏠',COVERS[0])]].forEach(([k,c])=>{
    NOTION_IMPORT[k].forEach(r=>{
      if(r.type&&!c.types.includes(r.type))c.types.push(r.type);
      if(S.tasks.some(t=>t.catId===c.id&&t.title===r.title))return;
      S.tasks.push({id:uid(),catId:c.id,title:r.title,status:r.status,type:r.type,desc:r.desc,due:r.due,time:'',priority:r.priority,note:r.note,image:''});n++})});
  S.memos??=[];NOTION_IMPORT.ideas.forEach(t=>{if(!S.memos.some(m=>m.text===t)){S.memos.push({id:uid(),text:t,color:'#fff6c7',w:260,h:200,fs:14,at:Date.now()});n++}});
  S.notionImported=true;save();return n;
}
let route={v:'home'}, calMonth=new Date(), calTab='mine', typeFilter='', sortBy='status', typeEdit=false;
function save(fromSync){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存容量がいっぱいです。大きな画像を減らすか、画像URLを使ってください。')}if(!fromSync&&booted)markDirty()}
let booted=false;
const cat=id=>S.categories.find(c=>c.id===id);
const tasksOf=id=>S.tasks.filter(t=>t.catId===id);
const isLate=t=>t.due&&t.due<today()&&t.status!=='done';

/* ---------- sidebar ---------- */
function renderSide(){
  const open=S.tasks.filter(t=>t.status!=='done');
  const todayN=open.filter(t=>t.due&&t.due<=today()).length;
  $('#side').innerHTML=`
   <div class="brand">My Workspace</div>
   <div class="clock side-clock"><div class="flip" id="flip"></div><div class="date" id="clockDate"></div></div>
   ${nav('home','🏡','Home')}
   ${nav('today','☀️','Today',todayN||'')}
   ${nav('memo','📝','Memo',(S.memos||[]).length||'')}

let mediaDB=null;const mediaURL={};
function db(){return mediaDB||(mediaDB=new Promise((ok,ng)=>{const r=indexedDB.open('myworkspace-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}))}
async function mediaPut(id,blob){const d=await db();return new Promise((ok,ng)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=ok;tx.onerror=()=>ng(tx.error)})}
async function mediaBlob(id){const d=await db();return new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function mediaGet(id){const u=await mediaGetLocal(id);if(u||!tokOK())return u;
  try{const f=await gFind('m-'+id);if(f){const b=await (await gfetch(`${DAPI}/files/${f.id}?alt=media`)).blob();await mediaPut(id,b);mediaURL[id]=URL.createObjectURL(b);markUp(id)}}catch(e){}return mediaURL[id]}
async function mediaGetLocal(id){if(mediaURL[id])return mediaURL[id];const d=await db();return new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(r.result){mediaURL[id]=URL.createObjectURL(r.result)}ok(mediaURL[id])};r.onerror=()=>ok(null)})}
async function mediaDel(id){const d=await db();d.transaction('files','readwrite').objectStore('files').delete(id);

function drag(handle,el,move,start,soft){if(!handle)return;
  handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(el.classList.contains('wg')&&matchMedia('(max-width:760px)').matches)return;if(e.target!==handle&&e.target.closest('button,input,label,textarea'))return;if(soft&&handle.tagName==='VIDEO'&&e.offsetY>handle.clientHeight-44)return;
    e.preventDefault();const sx=e.clientX,sy=e.clientY,o=start();el.classList.add('moving');handle.setPointerCapture(e.pointerId);
    const mv=ev=>move(ev.clientX-sx,ev.clientY-sy,o,ev);
    const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);el.classList.remove('moving');save()};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up)})}

/* 英語の部分を「My Workspace」と同じ書体にする */
const EN_SKIP=new Set(['SCRIPT','STYLE','INPUT','TEXTAREA','SELECT','OPTION','CODE','IFRAME']);
function enify(root){
  if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    for(let e=n.parentElement;e&&e!==root.parentElement;e=e.parentElement){
      if(EN_SKIP.has(e.tagName)||e.classList.contains('en')||e.classList.contains('flip')||e.classList.contains('brand')||e.classList.contains('greet')||e.isContentEditable)return NodeFilter.FILTER_REJECT}
    return /[A-Za-z]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const f=document.createDocumentFragment();let last=0;const v=n.nodeValue;
    v.replace(/[A-Za-z][A-Za-z0-9.,'&\- ]*[A-Za-z0-9.]|[A-Za-z]/g,(m,i)=>{if(i>last)f.append(v.slice(last,i));const sp=document.createElement('span');sp.className='en';sp.textContent=m;f.append(sp);last=i+m.length});
    if(last<v.length)f.append(v.slice(last));n.replaceWith(f)});
}

function lum(h){const n=parseInt(h.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]}

const hex2=h=>{const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255]};
const rgb2=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hex2(a),y=hex2(b);return rgb2(x.map((v,i)=>v+(y[i]-v)*t))};
function curImg(){const I=S.settings.bgImg||{},k=bgKey();return k in I?I[k]:I['*']||null}
function paintBg(){S.settings.bg??={};const m=$('#main'),side=$('#side'),tab=$('#tabbar');
  const c=S.settings.bg[bgKey()]||'',im=curImg();let tone=c;
  if(im){const f=im.fade||0,dk=lum(im.tone)<.3,ov=dk?'0,0,0':'255,255,255';
    m.style.backgroundImage=(f?`linear-gradient(rgba(${ov},${f}),rgba(${ov},${f})),`:'')+`url('${im.src}')`;m.classList.add('hasimg');
    tone=mix(im.tone,dk?'#000000':'#ffffff',f);m.style.backgroundColor=tone}
  else{m.style.backgroundImage='';m.classList.remove('hasimg');m.style.backgroundColor=c}
  const dark=!!tone&&lum(tone)<.25;m.classList.toggle('darkbg',dark);
  let sc='';if(tone)sc=im?(dark?mix(tone,'#000000',.25):mix(tone,'#ffffff',.55)):(dark?mix(tone,'#ffffff',.06):mix(tone,'#000000',.035));
  [side,tab].forEach(el=>{if(!el)return;el.style.background=sc;el.style.borderColor=sc?(dark?'rgba(255,255,255,.1)':'rgba(0,0,0,.07)'):'';el.classList.toggle('darkside',!!sc&&lum(sc)<.25)});
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',tone||'#f6f3ee')}
function avgTone(cv){const t=document.createElement('canvas');t.width=t.height=16;const g=t.getContext('2d');g.drawImage(cv,0,0,16,16);const d=g.getImageData(0,0,16,16).data;let r=0,gg=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2]}const n=d.length/4;return rgb2([r/n,gg/n,b/n])}

let lastClock='';
function tickClock(force){
  const el=$('#flip');if(!el)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const str=p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  if(force||!el.children.length){el.innerHTML=[0,1,2].map(i=>`<span class="tile"></span>${i<2?'<span class="colon">:</span>':''}`).join('');lastClock=''}
  const tiles=el.querySelectorAll('.tile');
  [0,1,2].forEach(i=>{const v=str.slice(i*2,i*2+2);if(tiles[i].textContent!==v){tiles[i].textContent=v;if(lastClock){tiles[i].classList.remove('tick');void tiles[i].offsetWidth;tiles[i].classList.add('tick')}}});
  lastClock=str;
  const ds=d.toLocaleDateString('en-US',{weekday:'long'})+' | '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const cd=$('#clockDate');if(cd.dataset.v!==ds){cd.dataset.v=ds;cd.innerHTML=`<span class="en">${ds}</span>`}
}

/* ---------- 週間天気（Open-Meteo・APIキー不要） ---------- */
let wx=null,wxAt=0;
const WMO=c=>c===0?['☀️','clear sky']:c<=2?['🌤️','partly cloudy']:c===3?['☁️','cloudy']:c<=48?['🌫️','fog']:c<=57?['🌦️','drizzle']:c<=67?['🌧️','rain']:c<=77?['🌨️','snow']:c<=82?['🌦️','showers']:c<=86?['🌨️','snow showers']:['⛈️','thunderstorm'];
async function drawWeather(){
  const el=$('#weather');if(!el)return;
  const w=S.settings.weather;
  if(!wx||Date.now()-wxAt>30*6e4||wx._key!==w.lat+','+w.lon){
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
    let err='';
    for(let k=0;k<2;k++){try{const r=await fetch(u,{cache:'no-store'});const j=await r.json();
        if(!r.ok||!j.current||!j.daily)throw Error(j.reason||('HTTP '+r.status));
        wx=j;wx._key=w.lat+','+w.lon;wxAt=Date.now();try{localStorage.setItem('myworkspace.wx',JSON.stringify(wx))}catch(e){}err='';break}
      catch(e){err=e.message;if(!k)await new Promise(o=>setTimeout(o,2500))}}
    if(err){let old=null;try{old=JSON.parse(localStorage.getItem('myworkspace.wx'))}catch(e){}

function startRepos(heightOnly){
  const h=$('#hero'),c=cat(h.dataset.cat),img=h.querySelector('.hero-img');repos={c,p:coverPos(c),orig:{...coverPos(c)}};const p=repos.p;
  h.classList.add('repos');
  h.insertAdjacentHTML('beforeend',`${img&&!heightOnly?'<div class="repos-hint">ドラッグして見せたい位置に動かす</div>':''}
    <div class="repos-bar">
      ${img&&!heightOnly?`<label>拡大<input type="range" min="100" max="300" value="${p.z}" id="rz_z"></label>`:''}
      <label>高さ<input type="range" min="120" max="460" value="${p.h}" id="rz_h"></label>
      <button class="ghost" onclick="endRepos(false)">キャンセル</button><button class="ok" onclick="endRepos(true)">保存</button></div>`);
  const apply=()=>{h.style.height=p.h+'px';if(img){img.style.objectPosition=`${p.x}% ${p.y}%`;img.style.transformOrigin=`${p.x}% ${p.y}%`;img.style.transform=`scale(${p.z/100})`}};
  $('#rz_z')&&($('#rz_z').oninput=e=>{p.z=+e.target.value;apply()});
  $('#rz_h').oninput=e=>{p.h=+e.target.value;apply()};
  if(img&&!heightOnly){
    img.onpointerdown=e=>{e.preventDefault();img.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y,W=h.clientWidth,H=h.clientHeight;
      const k=100/(p.z/100);
      img.onpointermove=ev=>{p.x=Math.min(100,Math.max(0,ox-(ev.clientX-sx)/W*k*1.4));p.y=Math.min(100,Math.max(0,oy-(ev.clientY-sy)/H*k*1.4));apply()};
      img.onpointerup=()=>{img.onpointermove=null}};
  }
}

/* ---------- Googleカレンダーの予定をAPIで読んで表示（iPhoneでも見られる） ---------- */
const GEV={};let gDay=null;
const gApiMode=()=>syncEnabled()&&SY.on;
const gHasScope=()=>(SY.scope||'').includes('calendar');
const dstr=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function gIds(){return S.settings.holidays!==false?[...S.settings.gcals,HOLIDAY_CAL]:[...S.settings.gcals]}
async function gLoadMonth(y,m){const key=y+'-'+m;if(GEV[key]?.loading)return;
  const ids=gIds(),have=GEV[key];if(have&&!have.loading&&ids.every(id=>have.cals[id])&&Date.now()-have.at<5*60e3)return;
  GEV[key]={loading:true,cals:have?.cals||{},at:0};
  const t0=new Date(y,m,1-7).toISOString(),t1=new Date(y,m+1,8).toISOString();
  await Promise.all(ids.map(async id=>{try{
      const r=await gfetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(id)}/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin=${encodeURIComponent(t0)}&timeMax=${encodeURIComponent(t1)}`);
      GEV[key].cals[id]={items:(await r.json()).items||[]}}
    catch(e){GEV[key].cals[id]={err:e.auth?'auth':(e.status===404||e.status===403&&!/disabled|accessNotConfigured|SERVICE_DISABLED/.test(e.message))?'noaccess':/disabled|accessNotConfigured|SERVICE_DISABLED/.test(e.message)?'api':'other',msg:e.message}}}));
  GEV[key].loading=false;GEV[key].at=Date.now();if(route.v==='calendar'&&calTab==='g')render()}
function gEventsOn(key,ds){const out=[];const G=GEV[key];if(!G)return out;
  for(const id in G.cals){const c=G.cals[id];if(!c.items||!gIds().includes(id))continue;
    c.items.forEach(e=>{if(e.status==='cancelled')return;let s,en,all=false;
      if(e.start?.date){all=true;s=e.start.date;en=e.end?.date||s;if(!(ds>=s&&ds<en))return}
      else{const a=new Date(e.start.dateTime),b=new Date(e.end?.dateTime||e.start.dateTime);s=dstr(a);en=dstr(new Date(b-1));if(!(ds>=s&&ds<=en))return}
      out.push({id,all,title:e.summary||(id===HOLIDAY_CAL?'祝日':'（予定あり）'),start:e.start.dateTime?new Date(e.start.dateTime):null,end:e.end?.dateTime?new Date(e.end.dateTime):null,link:e.htmlLink,color:gcolor(id)})})}
  return out.sort((a,b)=>(b.all-a.all)||((a.start||0)-(b.start||0)))}
const hm=d=>d.toLocaleTimeString('ja-JP',{hour:'numeric',minute:'2-digit'});
function gGridHTML(y,m){
  if(!tokOK())return `<div class="gerr">Googleの確認が切れています。<button class="btn primary" style="margin-left:8px" onclick="gAuth(true)">Googleにログインして表示</button></div>`;
  if(!gHasScope())return `<div class="gerr">Googleカレンダーを読む許可がまだありません。<button class="btn primary" style="margin-left:8px" onclick="gAuth(true)">許可して表示</button><br><small>ログイン画面で「カレンダーの表示」にチェックを入れてください。</small></div>`;
  const key=y+'-'+m,G=GEV[key];gLoadMonth(y,m);
  const errs=G?Object.entries(G.cals).filter(([id,c])=>c.err&&gIds().includes(id)):[];
  let note='';
  if(errs.some(([,c])=>c.err==='api'))note+=`<div class="gerr">⚠ Google Cloud で「Google Calendar API」がまだ有効になっていません。<a href="https://console.cloud.google.com/apis/library/calendar-json.googleapis.com" target="_blank" rel="noopener">こちら</a>を開いて「有効にする」を押し、少し待ってから再読み込みしてください。</div>`;
  const na=errs.filter(([,c])=>c.err==='noaccess').map(([id])=>id);
  if(na.length)note+=`<div class="gerr">⚠ 次のカレンダーは、ログイン中のアカウント（${esc(SY.email||'')}）からは見られません：<b>${na.map(esc).join('、')}</b><br>そのカレンダーの持ち主のGoogleカレンダーで「設定と共有」→「特定のユーザーまたはグループと共有」に ${esc(SY.email||'ログイン中のアドレス')} を追加（権限は「予定の表示（すべての予定の詳細）」）すると表示されます。</div>`;
  if(errs.some(([,c])=>c.err==='other'))note+=`<div class="gerr">⚠ 一部の予定を読み込めませんでした。少し待ってから再読み込みしてください。</div>`;
  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dstr(d);
    const evs=gEventsOn(key,ds),hol=evs.find(e=>e.id===HOLIDAY_CAL)||(S.settings.holidays!==false&&HOLIDAYS[ds]);
    cells+=`<div class="d ${d.getMonth()!==m?'other':''} ${ds===today()?'today':''} ${hol||d.getDay()===0?'hol':''} ${d.getDay()===6?'sat':''} ${ds===gDay?'sel':''}" onclick="gDay='${ds}';render()"><span class="n">${d.getDate()}</span>
      ${evs.slice(0,4).map(e=>`<span class="gev ${e.all?'':'timed'}" style="background:${e.color};border-color:${e.color}">${e.all?'':`<i style="background:${e.color}"></i><b class="tm" style="font-weight:400">${hm(e.start)} </b>`}${esc(e.title)}</span>`).join('')}${evs.length>4?`<span class="gev timed">ほか${evs.length-4}件</span>`:''}</div>`;
    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==m)break}
  const sel=gDay&&gDay.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`?gDay:null;
  const list=sel?gEventsOn(key,sel):[];
  return `${note}${G?.loading&&!Object.keys(G.cals).length?'<p class="lead">予定を読み込み中…</p>':''}
    <div class="cal">${'日月火水木金土'.split('').map(w=>`<div class="dw">${w}</div>`).join('')}${cells}</div>
    ${sel?`<div class="gday"><h3>${new Date(sel+'T00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})}の予定</h3>
      ${list.length?list.map(e=>`<a class="it" href="${esc(e.link||'#')}" target="_blank" rel="noopener"><span class="t">${e.all?'終日':hm(e.start)+(e.end?'–'+hm(e.end):'')}</span><i style="background:${e.color}"></i><span>${esc(e.title)}</span></a>`).join(''):'<div class="lead" style="font-size:13px">予定はありません</div>'}</div>`:'<p class="lead" style="margin-top:10px;font-size:12.5px">日付をタップすると、その日の予定が一覧で出ます。</p>'}`}
/* 入力（メールアドレス・カレンダーID・埋め込みコード・URL）からカレンダーIDを取り出す */
function calIds(v){
  v=v.trim();const out=[];
  const srcs=[...v.matchAll(/[?&](?:amp;)?(?:src|cid)=([^&"'\s]+)/g)].map(m=>decodeURIComponent(m[1]));
  const list=srcs.length?srcs:v.split(/[\s,、]+/).filter(Boolean);
  list.forEach(id=>{if(!id.includes('@')&&/^[A-Za-z0-9+/=_-]+$/.test(id)){try{const d=atob(id.replace(/-/g,'+').replace(/_/g,'/'));if(d.includes('@'))id=d}catch(e){}}out.push(id)});
  return out;
}

  if(holLoading)return;let at=0;try{at=+localStorage.getItem('myworkspace.holidaysAt')||0}catch(e){}
  if(Object.keys(HOLIDAYS).length&&Date.now()-at<864e5)return;
  holLoading=true;
  try{HOLIDAYS=await (await fetch('https://holidays-jp.github.io/api/v1/date.json')).json();
    try{localStorage.setItem('myworkspace.holidays',JSON.stringify(HOLIDAYS));localStorage.setItem('myworkspace.holidaysAt',Date.now())}catch(e){}
    if(route.v==='calendar')render()}catch(e){}
  holLoading=false}
function moveMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);render()}

/* ---------- actions ---------- */
function toggle(id){const t=S.tasks.find(x=>x.id===id);t.status=t.status==='done'?'todo':'done';save();render()}
function quickAdd(e,catId,status){e.preventDefault();const v=e.target.querySelector('input').value.trim();if(!v)return;
  S.tasks.push({id:uid(),catId,title:v,status,type:typeFilter,due:'',time:'',priority:'',note:'',image:''});save();render();
  setTimeout(()=>(document.querySelector(`.col[data-status="${status}"] .quick input`)||document.querySelector('.addrow input'))?.focus())}
function dropTo(e,status){e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!t)return;t.status=status;
  const col=e.target.closest('.col'),over=e.target.closest('.task');
  if(col){const ids=[...col.querySelectorAll('.task')].map(x=>x.dataset.id).filter(id=>id!==t.id);let k=over&&over.dataset.id!==t.id?ids.indexOf(over.dataset.id):ids.length;
    if(over){const r=over.getBoundingClientRect();if(e.clientY>r.top+r.height/2)k++}ids.splice(k,0,t.id);ids.forEach((id,i)=>S.tasks.find(x=>x.id===id).order=i*10)}
  save();render()}
function renameCat(id,name){const c=cat(id);name=name.trim();if(name&&c.name!==name){c.name=name;save();renderSide()}}
function newTaskOn(ds){const c=S.categories[0];if(!c)return newCat();const t={id:uid(),catId:c.id,title:'',status:'todo',type:'',due:ds,time:'',priority:'',note:'',image:''};openTask(null,t)}

/* ---------- image helpers ---------- */
function pickImage(cb,W0,Q){const f=$('#fileIn');f.onchange=()=>{const file=f.files[0];f.value='';if(!file)return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const W=W0||1400,s=Math.min(1,W/img.width);const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',Q||.8),cv)};img.src=r.result};r.readAsDataURL(file)};f.click()}

/* ---------- task dialog ---------- */
let draft=null;
function openTask(id,fresh){
  draft=fresh?{...fresh,_new:true}:{...S.tasks.find(t=>t.id===id)}; if(!draft.id)return;
  drawTaskDlg(); $('#taskDlg').showModal(); if(draft._new)setTimeout(()=>$('#taskDlg .tt').focus());
}
function drawTaskDlg(){
  const t=draft;
  $('#taskDlg').innerHTML=`
   <div class="dlg-cover" style="${t.image?`background-image:url('${esc(t.image)}')`:'height:56px'}">
     <div class="pick"><button onclick="pickImage(v=>{draft.image=v;keepFields();drawTaskDlg()})">🖼 画像を${t.image?'変更':'追加'}</button>
     <button onclick="const u=prompt('画像のURL');if(u){draft.image=u;keepFields();drawTaskDlg()}">URL</button>
     ${t.image?`<button onclick="draft.image='';keepFields();drawTaskDlg()">削除</button>`:''}</div></div>
   <div class="dlg-body">
     <input class="tt" id="f_title" value="${esc(t.title)}" placeholder="タスク名">
     <div class="prop"><label>分類</label><select id="f_cat" onchange="keepFields();drawTaskDlg()">${S.categories.map(c=>`<option value="${c.id}" ${c.id===t.catId?'selected':''}>${c.icon?c.icon+' ':''}${esc(c.name)}</option>`).join('')}</select></div>
     ${cat(t.catId)?.types?.length?`<div class="prop"><label>種類</label><select id="f_type"><option value="">なし</option>${cat(t.catId).types.map(ty=>`<option ${ty===t.type?'selected':''}>${esc(ty)}</option>`).join('')}</select></div>`:''}
     <div class="prop"><label>ステータス</label><select id="f_status">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${s.label}</option>`).join('')}</select></div>
     <div class="prop"><label>期限</label><div style="display:flex;gap:6px"><input type="date" id="f_due" value="${t.due||''}"><input type="time" id="f_time" value="${t.time||''}"></div></div>
     <div class="prop"><label>優先度</label><select id="f_pri">${['','高','中','低'].map(p=>`<option ${p===t.priority?'selected':''} value="${p}">${p||'なし'}</option>`).join('')}</select></div>
     <div class="prop"><label>説明</label><input id="f_desc" value="${esc(t.desc||'')}" placeholder="一言で"></div>
     <textarea id="f_note" placeholder="メモ">${esc(t.note||'')}</textarea>
     <div class="row">
       ${t._new?'':`<button class="danger" onclick="delTask()">削除</button>`}
       <span class="grow"></span>
       <a class="link" href="#" onclick="keepFields();gcalAdd(draft);return false">＋ Googleカレンダーに追加</a>
       <button class="btn" onclick="$('#taskDlg').close()">閉じる</button>
       <button class="btn primary" onclick="saveTask()">保存</button>
     </div></div>`;
}
function keepFields(){const g=i=>document.getElementById(i)?.value;if(!g('f_title')&&g('f_title')!=='')return;
  Object.assign(draft,{title:g('f_title'),catId:g('f_cat'),status:g('f_status'),due:g('f_due'),time:g('f_time'),priority:g('f_pri'),note:g('f_note'),desc:g('f_desc')??'',type:g('f_type')??''})}
function saveTask(){keepFields();if(!draft.title.trim()){$('#f_title').focus();return}
  const isNew=draft._new;delete draft._new;const fh=draft.fromHome;delete draft.fromHome;if(fh){S.settings.lastCat=draft.catId;setTimeout(()=>toast(`${cat(draft.catId)?.name||''} に追加しました`))}
  if(isNew)S.tasks.push(draft);else Object.assign(S.tasks.find(t=>t.id===draft.id),draft);
  save();$('#taskDlg').close();render()}
function delTask(){if(!confirm('このタスクを削除しますか？'))return;S.tasks=S.tasks.filter(t=>t.id!==draft.id);save();$('#taskDlg').close();render()}

/* Googleカレンダー：予定作成画面を開く（ログイン済みのGoogleアカウントに登録） */
function gcalAdd(t){
  if(!t.due){alert('先に期限の日付を入れてください');return}
  const d=t.due.replace(/-/g,'');let dates;
  if(t.time){const[h,mi]=t.time.split(':').map(Number);const e=new Date(2000,0,1,h+1,mi);
    dates=`${d}T${t.time.replace(':','')}00/${d}T${String(e.getHours()).padStart(2,'0')}${String(e.getMinutes()).padStart(2,'0')}00`;}
  else{const n=new Date(t.due);n.setDate(n.getDate()+1);dates=`${d}/${n.toISOString().slice(0,10).replace(/-/g,'')}`}
  const c=cat(t.catId);
  const u=new URL('https://calendar.google.com/calendar/render');
  u.searchParams.set('action','TEMPLATE');u.searchParams.set('text',t.title);u.searchParams.set('dates',dates);
  u.searchParams.set('details',(c?`[${c.name}] `:'')+(t.note||''));
  window.open(u,'_blank');
}

/* ---------- category dialog ---------- */
let cdraft=null;
function newCat(){cdraft={id:uid(),name:'',types:[],icon:'📁',cover:COVERS[Math.floor(Math.random()*COVERS.length)],_new:true};drawCatDlg();$('#catDlg').showModal()}
function editCat(id){cdraft={...cat(id)};drawCatDlg();$('#catDlg').showModal()}
function drawCatDlg(){const c=cdraft;
  $('#catDlg').innerHTML=`<div class="dlg-cover" style="background-image:${bg(c.cover)}">
    <div class="pick"><button onclick="keepCat();pickImage(v=>{cdraft.cover=v;liveCat()})">🖼 写真をアップロード</button>
    <button onclick="keepCat();const u=prompt('画像のURL');if(u){cdraft.cover=u.trim();liveCat()}">URL</button></div></div>
   <div class="dlg-body">
     <div style="display:flex;gap:10px;align-items:center">${c.icon?`<span style="font-size:34px">${c.icon}</span>`:''}
     <input class="tt" id="c_name" value="${esc(c.name)}" placeholder="分類の名前（例：仕事）" style="padding:0"></div>
     <div class="prop" style="grid-template-columns:1fr"><label>アイコン</label></div>
     <div class="emojis"><button style="font-size:12px;padding:4px 10px;border:1px dashed var(--line);${c.icon?'':'background:var(--accent-soft)'}" onclick="keepCat();cdraft.icon='';liveCat()">なし</button>${EMOJIS.map(e=>`<button onclick="keepCat();cdraft.icon='${e}';liveCat()">${e}</button>`).join('')}</div>
     <div class="prop" style="grid-template-columns:1fr"><label>タスクの種類（カンマ区切り。空なら種類なし）</label></div>
     <input id="c_types" value="${esc((c.types||[]).join(', '))}" placeholder="例：新チーム, 大黒柱" style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
     <div class="prop" style="grid-template-columns:1fr"><label>カバー</label></div>
     <div class="covers">${COVERS.map((v,i)=>`<button style="background-image:${v}" onclick="keepCat();cdraft.cover=COVERS[${i}];liveCat()"></button>`).join('')}</div>
     <div class="row">${c._new?'':`<button class="danger" onclick="delCat()">分類を削除</button>`}<span class="grow"></span>
       <button class="btn" onclick="$('#catDlg').close()">閉じる</button><button class="btn primary" onclick="saveCat()">保存</button></div>
   </div>`;
  setTimeout(()=>c._new&&$('#c_name')?.focus())}
function keepCat(){const n=$('#c_name');if(n)cdraft.name=n.value;const ty=$('#c_types');if(ty)cdraft.types=ty.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean)}
/* 既存の分類はカバー・アイコンをその場で反映 */
function liveCat(){if(!cdraft._new){const c=cat(cdraft.id);c.cover=cdraft.cover;c.icon=cdraft.icon;save();render()}drawCatDlg()}
function saveCat(){keepCat();if(!cdraft.name.trim()){$('#c_name').focus();return}
  const isNew=cdraft._new;delete cdraft._new;
  if(isNew)S.categories.push(cdraft);else Object.assign(cat(cdraft.id),cdraft);
  save();$('#catDlg').close();isNew?go('cat',cdraft.id):render()}
function delCat(){const n=tasksOf(cdraft.id).length;if(!confirm(`「${cdraft.name}」${n?`と中のタスク${n}件`:''}を削除しますか？`))return;
  S.categories=S.categories.filter(c=>c.id!==cdraft.id);S.tasks=S.tasks.filter(t=>t.catId!==cdraft.id);save();$('#catDlg').close();go('home')}

/* ---------- backup ---------- */
async function exportData(){const out={...S,_media:{}};
  for(const id of new Set((S.widgets||[]).map(w=>w.mediaId).filter(Boolean))){const b=await mediaBlob(id).catch(()=>null);if(b)out._media[id]=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download=`myworkspace-${today()}.json`;a.click()}
function fixS(d){d.settings??={};d.settings.gcals??=[];d.settings.weather??={name:'FUKUYAMA',lat:34.4858,lon:133.3626};d.categories.forEach(c=>c.types??=[]);d.memos??=[];return d}
function importData(){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!d.categories||!d.tasks)throw Error('形式が違います');if(confirm('今のデータをバックアップの内容で置き換えます。よろしいですか？')){const m=d._media||{};delete d._media;for(const id in m){try{await mediaPut(id,await (await fetch(m[id])).blob())}catch(e){}}S=fixS(d);SY.restored=true;saveSY();save();go('home');toast('バックアップから復元しました')}}catch(e){alert('読み込めませんでした：'+e.message)}};f.click()}

/* ---------- Googleドライブで同期（PC・iPhone共通） ---------- */
const GOOGLE_CLIENT_ID='127251143592-3vg9ste8i6u14gi431stg4cch06gq4on.apps.googleusercontent.com';
const DAPI='https://www.googleapis.com/drive/v3',UAPI='https://www.googleapis.com/upload/drive/v3',DOC='myworkspace.json';
const SCOPE='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/calendar.readonly email';
let SY={};try{SY=JSON.parse(localStorage.getItem('myworkspace.sync'))||{}}catch(e){}
const saveSY=()=>{try{localStorage.setItem('myworkspace.sync',JSON.stringify(SY))}catch(e){}};
let syncState='',syncBusy=false,pushTimer=null,syncErr='';
const syncEnabled=()=>GOOGLE_CLIENT_ID&&!GOOGLE_CLIENT_ID.includes('%%')&&location.protocol==='https:';
const tokOK=()=>SY.on&&SY.tok&&Date.now()<SY.exp;
function toast(msg,ms=4000){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
/* Googleのログイン画面へ移動（interactive=false は画面を出さずに確認だけ） */
function gAuth(interactive){const st=uid();try{localStorage.setItem('myworkspace.oauth',JSON.stringify({st,silent:!interactive}))}catch(e){}
  const p=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:'token',scope:SCOPE,state:st,include_granted_scopes:'true',prompt:interactive?'select_account':'none'});
  if(SY.email)p.set('login_hint',SY.email);
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p}
/* Googleから戻ってきたとき */
function gReturn(){const h=new URLSearchParams(location.hash.slice(1));if(!h.has('state'))return;
  let o={};try{o=JSON.parse(localStorage.getItem('myworkspace.oauth'))||{}}catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
  if(h.get('state')!==o.st)return;
  if(h.get('access_token')){SY.on=true;SY.tok=h.get('access_token');SY.exp=Date.now()+(+h.get('expires_in')-120)*1000;SY.scope=h.get('scope')||'';saveSY()}
  else if(h.get('error')){syncState='need';if(!o.silent)syncErr='Googleにログインできませんでした（'+h.get('error')+'）'}}
async function gfetch(url,opt={}){if(!tokOK())throw Object.assign(Error('auth'),{auth:1});
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+SY.tok}});
  if(r.status===401){SY.tok='';saveSY();throw Object.assign(Error('auth'),{auth:1})}
  if(!r.ok)throw Object.assign(Error('Google '+r.status+' '+(await r.text()).slice(0,200)),{status:r.status});return r}
async function gFind(name){const q=encodeURIComponent(`name='${name}'`);return (await (await gfetch(`${DAPI}/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&pageSize=1`)).json()).files[0]}
async function gUpload(name,blob,id){
  if(id)return (await gfetch(`${UAPI}/files/${id}?uploadType=media&fields=id,modifiedTime`,{method:'PATCH',body:blob})).json();
  const bd='mw'+Date.now().toString(36)+Math.random().toString(36).slice(2);
  const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:['appDataFolder']})}\r\n--${bd}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${bd}--`]);
  return (await gfetch(`${UAPI}/files?uploadType=multipart&fields=id,modifiedTime`,{method:'POST',body,headers:{'Content-Type':'multipart/related; boundary='+bd}})).json()}
const markUp=id=>{SY.up??=[];if(!SY.up.includes(id)){SY.up.push(id);saveSY()}};
function markDirty(){SY.dirty=true;saveSY();if(!syncEnabled()||!SY.on)return;clearTimeout(pushTimer);
  if(tokOK())pushTimer=setTimeout(syncNow,2500);else setSync('need')}
async function syncNow(){if(syncBusy||!tokOK())return;syncBusy=true;setSync('busy');clearTimeout(pushTimer);
  try{
    if(!SY.email){try{SY.email=(await (await gfetch('https://www.googleapis.com/oauth2/v3/userinfo')).json()).email||''}catch(e){}}
    const f=await gFind(DOC);
    if(f&&f.modifiedTime!==SY.mod){
      const doc=await (await gfetch(`${DAPI}/files/${f.id}?alt=media`)).json();
      let take=true;
      if(SY.mod?SY.dirty:SY.restored)take=confirm(SY.mod?'別の端末でも変更されています。\n\nOK：別の端末の内容を使う\nキャンセル：この端末の内容で上書きする'
                                   :'Googleドライブに保存済みのデータがあります。\n\nOK：保存済みのデータを使う\nキャンセル：この端末のデータで上書きする');
      if(take&&doc.data?.categories){S=fixS(doc.data);save(true);SY.dirty=false;render()}
      SY.mod=f.modifiedTime;SY.restored=false;
    }
    if(SY.dirty||!f){const r=await gUpload(DOC,new Blob([JSON.stringify({savedAt:new Date().toISOString(),data:S})],{type:'application/json'}),f?.id);SY.mod=r.modifiedTime;SY.dirty=false;SY.restored=false}
    for(const id of new Set((S.widgets||[]).map(w=>w.mediaId).filter(Boolean))){if((SY.up||[]).includes(id))continue;
      const b=await mediaBlob(id);if(b&&!(await gFind('m-'+id)))await gUpload('m-'+id,b);if(b)markUp(id)}
    SY.at=Date.now();syncErr='';setSync('ok');
  }catch(e){if(e.auth)setSync('need');else{syncErr=e.message;setSync('err')}console.warn(e)}
  finally{syncBusy=false;saveSY()}}
function syncLabel(){const t=SY.at?new Date(SY.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'';
  if(!SY.on)return '<span class="ico">☁️</span>Googleで同期<span class="sub">PC・iPhoneで同じデータに</span>';
  if(syncState==='busy')return '<span class="ico">☁️</span>同期しています…';
  if(syncState==='err')return '<span class="ico">⚠️</span>同期できませんでした<span class="sub">タップでもう一度</span>';
  if(!tokOK())return '<span class="ico">☁️</span>タップして同期<span class="sub">Googleの確認が切れました</span>';
  return `<span class="ico">☁️</span>同期済み ${t}<span class="sub">${esc(SY.email||'')}</span>`}
function setSync(st){syncState=st;const b=$('#syncBtn');if(b)b.innerHTML=syncLabel();
  let p=$('#syncpill');if(!p){p=document.createElement('button');p.id='syncpill';p.className='syncpill';p.onclick=syncClick;document.body.appendChild(p)}
  const show=SY.on&&(st==='busy'||st==='err'||!tokOK());
  p.className='syncpill'+(show?' show':'')+(st==='busy'?' busy':st==='err'?' err':'');
  p.textContent=st==='busy'?'☁ 同期中…':st==='err'?'⚠ 同期できませんでした':'☁ タップして同期';}
function syncClick(){if(syncState==='err'&&syncErr&&tokOK()){toast(syncErr,6000)}if(tokOK())syncNow();else gAuth(true)}
function syncOff(){if(!confirm('この端末の同期をやめますか？（データはこの端末とGoogleドライブの両方に残ります）'))return;SY={};saveSY();setSync('');render()}
function syncBoot(){if(!syncEnabled())return;gReturn();
  if(SY.on&&!tokOK()&&Date.now()-(SY.tryAt||0)>10*60e3){SY.tryAt=Date.now();saveSY();gAuth(false);return true}
  setSync(syncState);if(syncErr)toast(syncErr,6000);if(tokOK())syncNow();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!SY.on)return;
    if(tokOK()){if(!syncBusy)syncNow()}else if(Date.now()-(SY.tryAt||0)>10*60e3){SY.tryAt=Date.now();saveSY();gAuth(false)}else setSync('need')});
  setInterval(()=>{if(document.visibilityState==='visible'&&tokOK()&&!syncBusy)syncNow()},90e3)}

function $(s){return document.querySelector(s)}
{const n=importNotion();if(n)setTimeout(()=>{document.body.insertAdjacentHTML('beforeend',`<div id="toast" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2a28;color:#fff;padding:10px 20px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20;font-size:14px">Notionのタスクとアイデアを${n}件取り込みました</div>`);setTimeout(()=>$('#toast')?.remove(),5000)},300)}
if(!syncEnabled()||!syncBoot()){render();booted=true;syncEnabled()&&setSync(syncState)}
</script>
